<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hızlı Pano</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; width: 100%; max-width: 550px; padding: 24px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.2rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .status { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; background: #334155; color: #94a3b8; font-weight: bold; }
    textarea { width: 100%; height: 220px; background: #0f172a; color: #f1f5f9; border: 1px solid #475569; border-radius: 10px; padding: 14px; font-size: 1rem; resize: none; outline: none; margin-bottom: 16px; }
    textarea:focus { border-color: #38bdf8; }
    .btns { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-save { background: #38bdf8; color: #0f172a; }
    .btn-save:hover { background: #7dd3fc; }
    .btn-copy { background: #22c55e; color: #0f172a; }
    .btn-copy:hover { background: #4ade80; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>📋 Hızlı Pano</h1>
      <span id="status" class="status">Hazır</span>
    </div>
    
    <textarea id="textPad" placeholder="Telefondan kopyaladığın yazıyı buraya yapıştır ve 'Gönder'e bas..."></textarea>
    
    <div class="btns">
      <button class="btn-save" onclick="saveText()">📤 Gönder (Telefonda)</button>
      <button class="btn-copy" onclick="copyText()">📋 Kopyala (PC'de)</button>
    </div>
  </div>

  <script>
    // ⚠️ ÖNEMLİ: Kendine özel, başkasının tahmin edemeyeceği rastgele bir anahtar belirle!
    const OZEL_ANAHTAR = "hastane-pano-2026-x9y8z7"; 
    const API_URL = "https://keyval.org/api/" + OZEL_ANAHTAR;

    const textPad = document.getElementById('textPad');
    const status = document.getElementById('status');
    let lastValue = "";

    async function saveText() {
      const val = textPad.value;
      if (!val) return;
      
      setStatus("Gönderiliyor...", "#facc15");
      try {
        await fetch(API_URL, { method: 'POST', body: val });
        lastValue = val;
        setStatus("Kaydedildi! ✓", "#4ade80");
      } catch (err) {
        setStatus("Hata oluştu!", "#ef4444");
      }
    }

    async function checkNewText() {
      try {
        const res = await fetch(API_URL);
        const data = await res.text();
        
        if (data && data !== lastValue && document.activeElement !== textPad) {
          textPad.value = data;
          lastValue = data;
          setStatus("Yeni Metin Geldi! 🔔", "#38bdf8");
        }
      } catch (err) {
        // Sessizce geç
      }
    }

    function copyText() {
      textPad.select();
      navigator.clipboard.writeText(textPad.value);
      setStatus("Panoya Kopyalandı!", "#22c55e");
    }

    function setStatus(msg, color) {
      status.innerText = msg;
      status.style.color = color;
    }

    checkNewText();
    setInterval(checkNewText, 3000);
  </script>
</body>
</html>
