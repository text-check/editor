<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Editor</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>📋 Text Editor</h1>

    <!-- Mobil -->
    <div id="mobileEditor">

        <textarea
            id="message"
            placeholder="Buraya yapıştır..."
        ></textarea>

        <button id="saveBtn">
            💾 Save
        </button>

        <div id="status"></div>

    </div>

    <!-- Desktop -->
    <div id="desktopViewer">

        <div class="card">

            <pre id="preview"></pre>

        </div>

        <button id="copyBtn">
            📋 Copy
        </button>

    </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
