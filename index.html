<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shared Clipboard</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>📋 Shared Clipboard</h1>

    <textarea
        id="message"
        placeholder="Buraya yapıştır..."
    ></textarea>

    <button id="saveBtn">💾 Kaydet</button>

    <div id="status"></div>

    <div class="card">

        <div class="cardHeader">
            <span>Son Kaydedilen</span>

            <button id="copyBtn">
                📋 Kopyala
            </button>
        </div>

        <pre id="preview"></pre>

    </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
