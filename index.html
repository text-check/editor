
<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f5f7fb">

    <title>Text Editor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">

            <div class="logo">
                <div class="logo-icon">T</div>
                <h1>Text Editor</h1>
            </div>

            <p class="subtitle">
                Metinlerini kolayca sakla, düzenle ve paylaş.
            </p>

        </header>


        <section class="editor-card">

            <div class="editor-header">

                <div>
                    <h2>Metin Alanı</h2>
                    <p>Metnini buraya yapıştırabilirsin.</p>
                </div>

                <span class="editor-badge">
                    <span class="status-dot"></span>
                    Online
                </span>

            </div>


            <textarea
                id="message"
                placeholder="Buraya metnini yapıştır veya yazmaya başla..."
                spellcheck="false"
            ></textarea>


            <div class="buttons">

                <button id="saveBtn" class="save-btn">
                    <span>💾</span>
                    Kaydet
                </button>

                <button id="refreshBtn" class="refresh-btn">
                    <span>↻</span>
                    Yenile
                </button>

                <button id="copyBtn" class="copy-btn">
                    <span>📋</span>
                    Kopyala
                </button>

                <button id="clearBtn" class="clear-btn">
                    <span>✕</span>
                    Metni Sil
                </button>

            </div>


            <div class="status-wrapper">
                <div id="status" aria-live="polite"></div>
            </div>

        </section>


        <footer>
            <span>Simple. Fast. Reliable.</span>
        </footer>

    </main>


    <script type="module" src="app.js?v=4"></script>

</body>

</html>
